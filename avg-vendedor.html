<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Vendedor</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <h1>Panel de Vendedor</h1>

  <!-- Formulario para agregar producto -->
  <section class="form-section">
    <h2>Agregar Producto</h2>
    <input type="text" id="nombreProducto" placeholder="Nombre del producto">
    <input type="text" id="categoriaProducto" placeholder="Categoría">
    <input type="number" id="precioProducto" placeholder="Precio" min="0" step="0.01">
    <input type="number" id="descuentoProducto" placeholder="Descuento (%)" min="0" max="100">
    <input type="text" id="imagenProducto" placeholder="URL de imagen">
    <input type="text" id="vendedorProducto" placeholder="Nombre del vendedor">
    <button id="agregarProducto">Agregar Producto</button>
  </section>

  <!-- Lista de productos actuales -->
  <section>
    <h2>Productos Actuales</h2>
    <div id="listaProductos"></div>
  </section>

  <script src="vendedor.js"></script>
</body>
</html>
